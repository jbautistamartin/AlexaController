# Esta plantilla de AWS SAM se ha generado a partir de la configuración de su
# función. Si su función tiene uno o más desencadenadores, tenga en cuenta que los
# recursos de AWS asociados a estos desencadenadores no están completamente
# especificados en esta plantilla e incluyen valores de marcadores de posición.
# Abra esta plantilla en AWS Infrastructure Composer o en su IDE favorito y
# modifíquela para especificar una aplicación sin servidor con otros recursos de
# AWS.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Resources:
  AlexaController:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Description: ''
      MemorySize: 128
      Timeout: 3
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource:
                - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/AlexaController:*"
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      Events:
        AlexaSkillEvent1:
          Type: AlexaSkill
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
  AlexaSkillEvent1:
    Type: Alexa::ASK::Skill
    Properties:
      AuthenticationConfiguration:
        ClientId: Fill in      # TODO: Client ID de la Alexa Developer Console (pestaña Permissions)
        ClientSecret: Fill in  # TODO: Client Secret de la Alexa Developer Console (pestaña Permissions)
        RefreshToken: Fill in  # TODO: Refresh Token obtenido mediante Login with Amazon (LWA)
      SkillPackage: Fill in    # TODO: Ruta al paquete del skill o ARN del bucket S3
      VendorId: Fill in        # TODO: Vendor ID de la Alexa Developer Console
